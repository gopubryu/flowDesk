name: Integration tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/auth-workspace
  pull_request:
    paths:
      - "app/api/**"
      - "lib/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-tests.yml"

concurrency:
  group: flowdesk-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowdesk_test
          POSTGRES_PASSWORD: flowdesk_test
          POSTGRES_DB: flowdesk_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U flowdesk_test -d flowdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://flowdesk_test:flowdesk_test@127.0.0.1:54329/flowdesk_test
      DATABASE_URL_UNPOOLED: postgresql://flowdesk_test:flowdesk_test@127.0.0.1:54329/flowdesk_test
      TEST_DATABASE_URL: postgresql://flowdesk_test:flowdesk_test@127.0.0.1:54329/flowdesk_test
      INTEGRATION_TEST: "1"
      CI_EXPECT_INTEGRATION: "1"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - name: Run isolated-database integration suite
        run: |
          set -o pipefail
          npm run test:integration | tee integration-output.txt
      - name: Assert integration scenarios actually executed
        run: |
          # A green run must come from executed scenarios, never from a silent skip.
          passed=$(grep -E '^# pass [0-9]+$' integration-output.txt | awk '{print $3}')
          skipped=$(grep -E '^# skipped [0-9]+$' integration-output.txt | awk '{print $3}')
          echo "integration pass=$passed skipped=$skipped"
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::Integration suite skipped $skipped scenario(s); the isolated database was not exercised."
            exit 1
          fi
          # 16 module scenarios + the skip guard.
          if [ "${passed:-0}" -lt 17 ]; then
            echo "::error::Expected at least 17 executed integration scenarios, got ${passed:-0}."
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: git diff --check
