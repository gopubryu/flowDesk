name: Integration tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/auth-workspace
  pull_request:
    paths:
      - "app/api/**"
      - "lib/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-tests.yml"

concurrency:
  group: flowdesk-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowdesk_test
          POSTGRES_PASSWORD: flowdesk_test
          POSTGRES_DB: flowdesk_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U flowdesk_test -d flowdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://flowdesk_test:flowdesk_test@127.0.0.1:54329/flowdesk_test
      DATABASE_URL_UNPOOLED: postgresql://flowdesk_test:flowdesk_test@127.0.0.1:54329/flowdesk_test
      TEST_DATABASE_URL: postgresql://flowdesk_test:flowdesk_test@127.0.0.1:54329/flowdesk_test
      INTEGRATION_TEST: "1"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npx tsc --noEmit
      - run: git diff --check
